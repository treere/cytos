[package]
name = "cytos_transformers"
version = "0.1.0"
edition = "2024"
description = "A collection of transformer nodes for the Cytos dataflow framework, including image processing, logic operations, machine learning, and I/O utilities."

[lib]
crate-type = ["cdylib"]

[dependencies]
image = "0.25.1"
cytos = { path = "../cytos" }
cytos_derive = { path = "../cytos_derive" }
rscam = "0.5.5"
serde = { version = "1.0", features = ["derive"] }
rustface = "0.1.7"
reqwest = { version = "0.12.9", features = ["blocking","json"] }
ort = {version = "=2.0.0-rc.10", features = ["fetch-models" ]}
ndarray = {version = "0.16.1", features = ["serde"]}
rand = "0.8"
