[package]
name = "cytos"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8.4"
indexmap = "2.3.0"
tracing = { version = "0.1.41", features = ["max_level_trace", "release_max_level_warn"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false
